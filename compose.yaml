services:
  triage:
    build: ./services/triage
    ports:
      - "127.0.0.1:${DEMO_PORT:-8080}:8080"
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      OPERATION_PATH: /incidents
      UPSTREAM_URL: http://normalizer:8081/normalize
    depends_on:
      - normalizer
  normalizer:
    build: ./services/normalizer
    environment:
      HOST: 0.0.0.0
      PORT: "8081"
      OPERATION_PATH: /normalize
